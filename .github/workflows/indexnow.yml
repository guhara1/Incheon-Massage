name: IndexNow & Indexing notify

# main 브랜치에 페이지/사이트맵/RSS가 바뀌어 푸시될 때마다
#  1) IndexNow로 빙·네이버·얀덱스에 변경 URL을 즉시 통보(무설정)
#  2) (선택) GOOGLE_INDEXING_SA 시크릿이 있으면 Google Indexing API도 변경분만 통보
# ⚠️ 구글 일반 페이지 색인의 정공법은 Search Console + sitemap 제출입니다.
#    sitemap ping(google.com/ping)은 2023년 폐지되어 사용하지 않습니다.

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'rss.xml'
  workflow_dispatch:        # 수동 실행도 허용

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # --changed 비교용(직전 커밋 대비)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Cloudflare Pages 배포가 반영될 시간을 잠깐 대기 (선택)
      - name: Wait for deploy to propagate
        run: sleep 90

      # ── IndexNow: 빙·네이버·얀덱스 즉시 통보(시크릿 불필요) ──
      - name: Submit changed URLs to IndexNow (Bing/Naver/Yandex)
        run: python3 tools/indexnow.py --changed

      # ── (선택) Google Indexing API: 변경분만 통보(쿼터 200/일 보호) ──
      - name: Google Indexing API (optional)
        if: ${{ secrets.GOOGLE_INDEXING_SA != '' }}
        env:
          GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        run: |
          printf '%s' "$GOOGLE_INDEXING_SA" > /tmp/gsa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gsa.json
          python3 -m pip install --quiet google-auth
          python3 tools/google_indexing.py --changed
          rm -f /tmp/gsa.json
